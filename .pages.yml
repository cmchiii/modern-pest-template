      - name: content_blocks
        label: Free layout
        type: object
        description: >-
          Build an arrangement out of parts. Use a named section when the pattern
          repeats across pages, and this when it does not.
        fields:
          - { name: eyebrow, label: Dimension callout, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: rich-text }
          - name: columns
            label: Columns
            type: select
            default: '2'
            description: >-
              Blocks fill these columns in order. Two columns with an image then text
              gives image on the left; text then image puts it on the right.
            options:
              values: ['1', '2', '3']
          - name: align
            label: Column alignment
            type: select
            default: start
            options:
              values:
                - { value: start, label: Top }
                - { value: center, label: Middle }
          - name: blocks
            label: Blocks
            type: block
            list:
              collapsible:
                collapsed: true
                summary: '{index}. {fields.caption}{fields.label}'
            blockKey: kind
            blocks:
              - name: text
                label: Text
                type: object
                fields:
                  - { name: body, label: Body, type: rich-text, required: true }
                  - name: align
                    label: Alignment
                    type: select
                    default: left
                    options:
                      values: [left, center]
                  - { name: full, label: Span all columns, type: boolean, default: false }
              - name: media
                label: Image or video
                type: object
                fields:
                  - { name: media, label: Media, component: media }
                  - { name: caption, label: Caption, type: string }
                  - name: ratio
                    label: Shape
                    type: select
                    default: '4/3'
                    options:
                      values: ['auto', '16/9', '4/3', '1/1']
                  - { name: full, label: Span all columns, type: boolean, default: false }
              - name: buttons
                label: Buttons
                type: object
                fields:
                  - name: items
                    label: Buttons
                    type: object
                    component: link
                    list:
                      collapsible:
                        collapsed: true
                        summary: '{fields.label}'
                  - name: align
                    label: Alignment
                    type: select
                    default: left
                    options:
                      values: [left, center]
                  - { name: full, label: Span all columns, type: boolean, default: true }
              - name: divider
