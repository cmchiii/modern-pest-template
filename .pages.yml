              - name: spacer
                label: Space
                type: object
                fields:
                  - name: size
                    label: Height
                    type: select
                    default: md
                    options:
                      values: [sm, md, lg]
          - name: headingLevel
            label: Heading level
            type: select
            default: h2
            options:
              values: [h1, h2, h3, h4]
          - { name: anchor, label: Anchor ID, type: string }
          - name: surface
            label: Background
            type: select
            default: light
            options:
              values:
                - { value: light, label: Page }
                - { value: muted, label: Muted }
                - { value: dark, label: Dark }
                - { value: brand, label: Brand }
          - name: spacing
            label: Vertical space
            type: select
            default: md
            options:
              values: [none, sm, md, lg]
          - name: width
            label: Content width
            type: select
            default: wide
            options:
