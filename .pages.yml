# Pages CMS schema -- https://pagescms.org/docs/configuration/
#
# This file is the editing contract. Every block below must stay in sync with
# two other places, all keyed by the same string:
#   - src/lib/section-schemas.ts  (validation)
#   - src/lib/sections.ts         (rendering)
# Adding a section in only two of the three is the failure mode to watch for.

media:
  input: public/media
  output: /media

components:
  page_sections:
    label: Page sections
    type: block
    list:
      collapsible:
        collapsed: true
        # The section's friendly type shows in the pill on the right, so the
        # summary carries the content instead: the heading, or the label for
        # the few blocks without one. A block with neither (the trust-badge
        # strip) still reads clearly from its index and type pill.
        summary: '{index}. {fields.heading}{fields.label}'
    blockKey: type
    blocks:
      - name: hero
        label: Hero
        type: object
        fields:
          - name: layout
            label: Layout
            type: select
            default: split
            options:
              values:
                - { value: split, label: Text beside image }
                - { value: centered, label: Centered text }
                - { value: full, label: Full-bleed background image }
          - name: background
            label: Background
            # A block field without `list` is how Pages CMS does conditional
            # fields: pick one kind and only that kind's inputs render.
            # Remove the block for a hero with no media.
            type: block
            blockKey: kind
            blocks:
              - name: image
                label: Single image
                type: object
                fields:
                  - { name: image, label: Image, component: image }
              - name: video
                label: Looping video
                type: object
                fields:
                  - { name: file, label: Video, component: video_file }
                  - name: poster
                    label: Poster image
                    type: image
                    description: >-
                      Shown until the video can play, and all a data-saving
                      browser ever downloads. Worth setting. Keep it under
                      about 3 MB.
              - name: carousel
                label: Image carousel
                type: object
                fields:
                  - name: slides
                    label: Slides
                    type: object
                    component: image
                    list:
                      collapsible:
                        collapsed: true
                        summary: '{index}. {fields.alt}'
                    description: Two or more slides required.
                  - name: interval
                    label: Seconds per slide
                    type: number
                    default: 6
          - name: eyebrow
            label: Dimension callout
            type: string
            description: Short label above the headline. A real measurement reads best.
          - { name: heading, label: Headline, type: string, required: true }
          - { name: body, label: Intro, type: rich-text }
          - name: mediaNote
            label: Image caption
            type: string
            description: >-
              Sits on the bottom edge of the image, and only on the
              "Text beside image" layout. A real measurement reads best.
          - name: ctas
            label: Buttons
            type: object
            component: link
            list:
              collapsible:
                collapsed: true
                summary: '{fields.label}'
          - { name: badges, label: Trust points, type: string, list: true }
          - name: rating
            label: Review rating
            type: object
            fields:
              - { name: value, label: Stars out of 5, type: number }
              - { name: count, label: Review count, type: number }
              - { name: label, label: Caption, type: string, default: verified reviews }
          - name: headingLevel
            label: Heading level
            type: select
            default: h1
            description: >-
              Document outline rank, not size. Use h1 once per page, on the
              section that opens it.
            options:
              values: [h1, h2, h3, h4]
          - { name: anchor, label: Anchor ID, type: string }
          - name: surface
            label: Background
            type: select
            default: light
            options:
              values:
                - { value: light, label: Page }
                - { value: muted, label: Muted }
                - { value: dark, label: Dark }
                - { value: brand, label: Brand }
          - name: spacing
            label: Vertical space
            type: select
            default: lg
            options:
              values: [none, sm, md, lg]
          - name: width
            label: Content width
            type: select
            default: wide
            options:
              values: [narrow, default, wide, full]

      - name: rich_text
        label: Rich text
        type: object
        fields:
          - { name: eyebrow, label: Dimension callout, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Body, type: rich-text, required: true }
          - name: align
            label: Alignment
            type: select
            default: left
            options:
              values: [left, center]
          - name: headingLevel
            label: Heading level
            type: select
            default: h2
            description: >-
              Document outline rank, not size. Use h1 once per page, on the
              section that opens it.
            options:
              values: [h1, h2, h3, h4]
          - { name: anchor, label: Anchor ID, type: string }
          - name: surface
            label: Background
            type: select
            default: light
            options:
              values:
                - { value: light, label: Page }
                - { value: muted, label: Muted }
                - { value: dark, label: Dark }
                - { value: brand, label: Brand }
          - name: spacing
            label: Vertical space
            type: select
            default: md
            options:
              values: [none, sm, md, lg]
          - name: width
            label: Content width
            type: select
            default: narrow
            options:
