      - name: form_block
        label: Form
        type: object
        fields:
          - { name: eyebrow, label: Dimension callout, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: rich-text }
          - name: endpoint
            label: Submit URL
            type: string
            required: true
            pattern: '^(https?://|/)'
            description: >-
              Where the form posts. Use your own Formspree, Web3Forms or serverless
              endpoint. This site stores nothing itself.
          - { name: submitLabel, label: Button label, type: string, default: Send }
          - name: fields
            label: Fields
            type: block
            list:
              collapsible:
                collapsed: true
                summary: '{index}. {fields.heading}{fields.label}'
            blockKey: kind
            blocks:
              - name: text
                label: Text
                type: object
                fields:
                  - { name: name, label: Field name, type: string, required: true }
                  - { name: label, label: Label, type: string, required: true }
                  - { name: placeholder, label: Placeholder, type: string }
                  - { name: required, label: Required, type: boolean, default: false }
                  - name: autocomplete
                    label: Autocomplete hint
                    type: string
                    description: Browser autofill token, for example given-name or postal-code.
                  - name: width
                    label: Field width
                    type: select
                    default: full
                    options:
                      values:
                        - { value: full, label: Full row }
                        - { value: half, label: Half row }
              - name: email
                label: Email
                type: object
                fields:
                  - { name: name, label: Field name, type: string, default: email, required: true }
                  - { name: label, label: Label, type: string, required: true }
                  - { name: placeholder, label: Placeholder, type: string }
                  - { name: required, label: Required, type: boolean, default: true }
                  - name: width
                    label: Field width
                    type: select
                    default: full
                    options:
                      values:
                        - { value: full, label: Full row }
                        - { value: half, label: Half row }
              - name: tel
                label: Phone
                type: object
                fields:
