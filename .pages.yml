            options:
              values: ['2', '3', '4']
          - name: tabs
            label: Tabs
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.label}'
            fields:
              - { name: label, label: Tab label, type: string, required: true }
              - name: bannerTitle
                label: Banner title
                type: string
                description: Large text on the banner. Defaults to the tab label.
              - { name: image, label: Banner image, component: image }
              - name: cards
                label: Service cards
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{fields.title}'
                fields:
                  - name: icon
                    label: Icon
                    type: select
                    description: Leave empty to show the card number instead.
                    options:
                      values:
                        - { value: '', label: 'Number only' }
                        - { value: shield, label: Shield }
                        - { value: phone, label: Phone }
                        - { value: clock, label: Clock }
                        - { value: check, label: Check }
                        - { value: star, label: Star }
                        - { value: wrench, label: Wrench }
                        - { value: badge, label: Badge }
                        - { value: dollar, label: Dollar }
                        - { value: truck, label: Truck }
                        - { value: user, label: Person }
                  - { name: title, label: Title, type: string, required: true }
                  - { name: body, label: Body, type: text }
                  - { name: link, label: Link, component: link }
          - name: headingLevel
            label: Heading level
            type: select
            default: h2
            options:
              values: [h1, h2, h3, h4]
          - { name: anchor, label: Anchor ID, type: string }
          - name: surface
            label: Background
            type: select
            default: light
            options:
              values:
                - { value: light, label: Page }
                - { value: muted, label: Muted }
                - { value: dark, label: Dark }
                - { value: brand, label: Brand }
          - name: spacing
            label: Vertical space
            type: select
            default: md
            options:
              values: [none, sm, md, lg]
          - name: width
            label: Content width
            type: select
            default: wide
            options:
              values: [narrow, default, wide, full]

      - name: promo_cards
        label: Promo cards
        type: object
        description: >-
          A row of image-led promotion cards: a photo with an icon and a
          corner badge, over a coloured panel with a title, an accent
          subtitle, a price or body, and a button beside a phone number. For
          the maintenance / financing / offer band, not the coupon grid
          (that is Offers and coupons).
        fields:
          - { name: eyebrow, label: Dimension callout, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: rich-text }
          - name: columns
            label: Columns
            type: select
            default: '3'
            options:
              values: ['2', '3']
          - name: cards
            label: Cards
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.title}'
            fields:
              - { name: image, label: Image, component: image }
              - name: icon
                label: Icon
                type: select
                description: Small chip on the photo. Leave empty for none.
                options:
                  values:
                    - { value: '', label: 'None' }
                    - { value: shield, label: Shield }
                    - { value: phone, label: Phone }
                    - { value: clock, label: Clock }
                    - { value: check, label: Check }
                    - { value: star, label: Star }
                    - { value: wrench, label: Wrench }
                    - { value: badge, label: Badge }
                    - { value: dollar, label: Dollar }
                    - { value: truck, label: Truck }
                    - { value: user, label: Person }
              - name: badge
                label: Corner badge
                type: string
                description: Small tag in the top corner, e.g. Members only, Limited time.
              - { name: title, label: Title, type: string, required: true }
              - name: subtitle
                label: Accent subtitle
                type: string
                description: The accent line under the title, e.g. For as low as.
              - name: price
                label: Price callout
                type: object
                description: Shown in place of the body. Leave empty for a text-only card.
                fields:
                  - { name: label, label: Small label above, type: string }
                  - { name: value, label: Value, type: string, required: true }
                  - { name: unit, label: Small label below, type: string }
              - { name: body, label: Body, type: text }
              - { name: cta, label: Button, component: link }
              - { name: phone, label: Phone (display), type: string }
              - name: phoneHref
                label: Phone (link)
                type: string
                description: Dialable form, e.g. tel:+15550142200. Derived from the display if left empty.
          - name: headingLevel
            label: Heading level
            type: select
            default: h2
            options:
              values: [h1, h2, h3, h4]
          - { name: anchor, label: Anchor ID, type: string }
          - name: surface
            label: Background
            type: select
            default: light
            options:
              values:
                - { value: light, label: Page }
                - { value: muted, label: Muted }
                - { value: dark, label: Dark }
                - { value: brand, label: Brand }
          - name: spacing
            label: Vertical space
            type: select
            default: md
            options:
              values: [none, sm, md, lg]
          - name: width
            label: Content width
            type: select
            default: wide
            options:
              values: [narrow, default, wide, full]

      - name: pricing_tiers
        label: Pricing tiers
        type: object
        description: >-
          A side-by-side comparison band of two to four tiers, one optionally
          featured. Each tier has a price, an optional term note, a ticked
          feature list, and a button. Add the toggle to let one switch flip
          every card between two price sets (e.g. monthly vs. total). For
          financing options or package comparisons, not the image-led promo
          band (that is Promo cards) or the coupon grid (Offers and coupons).
        fields:
          - { name: eyebrow, label: Dimension callout, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: rich-text }
          - name: columns
            label: Columns
            type: select
            default: '3'
            options:
              values: ['2', '3', '4']
          - name: toggle
            label: Billing toggle
            type: object
            description: >-
              Optional. When set, each tier switches between its main price
              and its alt price. Leave empty for static cards.
            fields:
              - { name: primaryLabel, label: First label, type: string, required: true }
              - { name: altLabel, label: Second label, type: string, required: true }
              - name: note
                label: Note beside switch
                type: string
                description: e.g. Longer terms, lower monthly.
          - name: tiers
            label: Tiers
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.name}'
            fields:
              - { name: name, label: Name, type: string, required: true }
              - name: badge
                label: Badge
                type: string
                description: Small tag on the featured card, e.g. Most chosen.
              - name: featured
                label: Featured
                type: boolean
                default: false
                description: Draws the recommended treatment. One per row reads best.
              - name: priceLabel
                label: Label above price
                type: string
                description: e.g. From.
              - { name: price, label: Price, type: string, required: true }
              - name: priceUnit
                label: Unit after price
                type: string
                description: e.g. /mo.
              - name: priceAlt
                label: Alt price
                type: string
                description: Shown in the toggle's second mode. Falls back to the price.
              - { name: priceAltUnit, label: Alt unit, type: string }
              - name: note
                label: Note under price
                type: string
                description: e.g. On jobs from $2,000.
              - name: features
                label: Features
                type: string
                list: true
                description: One line each, shown with a tick.
              - { name: cta, label: Button, component: link }
          - name: footnote
            label: Footnote
            type: text
            description: Small print under the row, e.g. the representative example.
          - name: headingLevel
            label: Heading level
            type: select
            default: h2
            options:
              values: [h1, h2, h3, h4]
          - { name: anchor, label: Anchor ID, type: string }
          - name: surface
            label: Background
            type: select
            default: muted
            options:
              values:
                - { value: light, label: Page }
                - { value: muted, label: Muted }
                - { value: dark, label: Dark }
                - { value: brand, label: Brand }
          - name: spacing
            label: Vertical space
            type: select
            default: md
            options:
              values: [none, sm, md, lg]
          - name: width
            label: Content width
            type: select
            default: wide
            options:
              values: [narrow, default, wide, full]

      - name: team
        label: Team grid
        type: object
        description: >-
          A grid of people, each a photo, name, role, and short bio.
          For a "meet the team" section. The role shows in accent caps
          between the name and the bio.
        fields:
          - { name: eyebrow, label: Dimension callout, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: rich-text }
          - name: columns
            label: Columns
            type: select
            default: '3'
            options:
              values: ['2', '3', '4']
          - name: members
            label: Members
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.name}'
            fields:
              - { name: photo, label: Photo, component: image }
              - { name: name, label: Name, type: string, required: true }
              - { name: role, label: Role, type: string }
              - { name: bio, label: Bio, type: text }
          - name: cta
            label: Button under the grid
            component: link
            description: >-
              Optional. Use on an overview to link to the full team page.
          - name: headingLevel
            label: Heading level
            type: select
            default: h2
            description: >-
              Document outline rank, not size. Use h1 once per page, on the
              section that opens it.
            options:
              values: [h1, h2, h3, h4]
          - { name: anchor, label: Anchor ID, type: string }
          - name: surface
            label: Background
            type: select
            default: light
            options:
              values:
                - { value: light, label: Page }
                - { value: muted, label: Muted }
                - { value: dark, label: Dark }
                - { value: brand, label: Brand }
          - name: spacing
            label: Vertical space
            type: select
            default: md
            options:
              values: [none, sm, md, lg]
          - name: width
            label: Content width
            type: select
            default: wide
            options:
              values: [narrow, default, wide, full]

      - name: global_block
        label: Global section
        type: object
        description: >-
          Drops a global section into the page. Edit the content once in its own
          entry (Book a Consultation or Map) and it stays in sync everywhere it
          is used. For questions and answers, use the Accordion section.
        fields:
          - name: which
            label: Which section
            type: select
            required: true
            default: booking
            options:
              values:
                - { value: booking, label: Book a Consultation }
                - { value: map, label: Map }
          - name: headingLevel
            label: Heading level
            type: select
            default: h2
            description: >-
              Document outline rank, not size. Use h1 once per page, on the
              section that opens it.
            options:
              values: [h1, h2, h3, h4]
          - { name: anchor, label: Anchor ID, type: string }
          - name: surface
            label: Background
            type: select
            description: Leave blank to use the section's usual background.
            options:
              values:
                - { value: light, label: Page }
                - { value: muted, label: Muted }
                - { value: dark, label: Dark }
                - { value: brand, label: Brand }
          - name: spacing
            label: Vertical space
            type: select
            description: Leave blank to use the section's usual spacing.
            options:
              values: [none, sm, md, lg]
          - name: width
            label: Content width
            type: select
            description: Leave blank to use the section's usual width.
            options:
              values: [narrow, default, wide, full]

  link:
    type: object
    label: Link
    fields:
      - { name: label, label: Label, type: string, required: true }
      - { name: href, label: URL, type: string, required: true }
      - name: style
        label: Style
        type: select
        default: primary
        options:
          values:
            - { value: primary, label: Primary button }
            - { value: secondary, label: Outline button }
            - { value: ghost, label: Text link }
      - { name: newTab, label: Open in new tab, type: boolean, default: false }

  image:
    # A block without `list` is how Pages CMS does conditional fields: the
    # editor picks upload or link and only that input renders. Both variants
    # write the same flat shape, so rendering does not care which was used.
    type: block
    label: Image
    blockKey: source
    blocks:
      - name: upload
        label: Upload a file
        type: object
        fields:
          - name: src
            label: File
            type: image
            required: true
            description: >-
              Under about 3 MB. The CMS sends uploads through a function whose
              request body caps at 4.5 MB, and base64 encoding inflates the file
              by a third. Phone photos are often 5-8 MB, so resize first, or
              link to a hosted copy instead.
          - name: alt
            label: Alt text
            type: string
            description: Describe what the image shows. Leave empty only if decorative.
      - name: url
        label: Link to a hosted image
        type: object
        fields:
          - name: src
            label: Image URL
            type: string
            required: true
            pattern: '^(https?://|/)'
            description: >-
              Full URL from your image host, or a path starting with / for a file
              already in this repo. No size limit this way.
          - name: alt
            label: Alt text
            type: string
            description: Describe what the image shows. Leave empty only if decorative.

  media:
    # Image, video or third-party embed. A block so only the chosen kind
    # renders inputs, and so two kinds can never both be filled.
    type: block
    label: Media
    blockKey: kind
    blocks:
      - name: image
        label: Image
        type: object
        fields:
          - name: source
            label: Where from
            type: select
            default: upload
            options:
              values:
                - { value: upload, label: Uploaded file }
                - { value: url, label: Hosted URL }
          - name: src
            label: Image file or URL
            type: string
            required: true
            description: >-
              Upload under about 3 MB, or paste a full URL from your image host.
          - name: alt
            label: Alt text
            type: string
            description: Describe what the image shows. Leave empty only if decorative.
      - name: video
        label: Video
        type: object
        fields:
          - name: src
            label: Video URL
            type: string
            required: true
            pattern: '^(https?://|/)'
            description: Direct MP4 URL. Use Embed below for YouTube or Vimeo.
          - { name: poster, label: Poster image, type: image }
          - name: autoplay
            label: Autoplay muted loop
            type: boolean
            default: false
            description: >-
              Off means the visitor gets play controls. On is for background
              motion only, and forces the video muted.
      - name: embed
        label: Embed
        type: object
        fields:
          - name: url
            label: URL
            type: string
            required: true
            description: >-
              Paste the normal address bar URL. YouTube and Vimeo watch links
              are converted automatically. Also takes maps and other iframes.
          - name: title
            label: Title
            type: string
            required: true
            description: >-
              Required. Screen readers announce this in place of the embed.
          - name: ratio
            label: Aspect ratio
            type: select
            default: '16/9'
            options:
              values: ['16/9', '4/3', '1/1', '21/9']

  video_file:
    type: block
    label: Video
    blockKey: source
    blocks:
      - name: upload
        label: Upload a file
        type: object
        fields:
          - name: src
            label: File
            type: file
            required: true
            description: >-
              Under about 3 MB, which is very short for video. Linking is
              usually the right choice. Note that git keeps every version of an
              uploaded file forever.
      - name: url
        label: Link to a hosted video
        type: object
        fields:
          - name: src
            label: Video URL
            type: string
            required: true
            pattern: '^(https?://|/)'
            description: Direct MP4 URL from your video host. No size limit this way.

content:
  - name: site
    label: Site Settings
    type: file
    path: src/content/site.json
    format: json
    fields:
      - { name: name, label: Business name, type: string, required: true }
      - { name: legalName, label: Legal name, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: logo, label: Logo, component: image }
      - name: logoOnDark
        label: Logo for dark backgrounds
        component: image
        description: Optional light version, used in the footer. Leave empty to knock the main logo out to white.

      - name: contact
        label: Contact
        type: object
        fields:
          - { name: phone, label: Phone (display), type: string, required: true }
          - name: phoneHref
            label: Phone (link)
            type: string
            description: Dialable form, for example tel:+15550142200
            required: true
          - { name: email, label: Email, type: string }
          - name: address
            label: Address
            type: object
            fields:
              - { name: street, label: Street, type: string }
              - { name: city, label: City, type: string }
              - { name: region, label: State / Region, type: string }
              - { name: postalCode, label: Postal code, type: string }
              - { name: country, label: Country, type: string, default: US }
          - { name: hours, label: Hours, type: string }

      # The footer is intentionally not editable in the CMS. Its link columns
      # and legal links are structural URLs that map to real routes, so a typo
      # would break navigation site-wide; they live in src/content/site.json as
      # developer-set defaults. The copyright line is built automatically from
      # the year and legal name, so there is nothing to edit here.

      - name: social
        label: Social profiles
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.platform}'
        fields:
          - { name: platform, label: Platform, type: string, required: true }
          - { name: href, label: URL, type: string, required: true }

      - name: theme
        label: Theme
        description: Brand colors and type. Changing these restyles the whole site.
        type: object
        fields:
          - name: primary
            label: Primary
            type: string
            required: true
            pattern: '^#[0-9a-fA-F]{6}$'
            description: 'Six-digit hex, for example #22463a'
          - name: primaryHover
            label: Primary (hover)
            type: string
            required: true
            pattern: '^#[0-9a-fA-F]{6}$'
            description: 'Six-digit hex, for example #22463a'
          - name: primaryFg
            label: Primary text
            type: string
            required: true
            pattern: '^#[0-9a-fA-F]{6}$'
            description: 'Six-digit hex, for example #22463a'
          - name: accent
            label: Accent
            type: string
            required: true
            pattern: '^#[0-9a-fA-F]{6}$'
            description: 'Six-digit hex, for example #22463a'
          - name: accentFg
            label: Accent text
            type: string
            required: true
            pattern: '^#[0-9a-fA-F]{6}$'
            description: 'Six-digit hex, for example #22463a'
          - name: accentInk
            label: Accent (on light)
            type: string
            required: true
            pattern: '^#[0-9a-fA-F]{6}$'
            description: 'Darker accent used on pale backgrounds, where the main accent fails contrast'
          - name: ink
            label: Heading text
            type: string
            required: true
            pattern: '^#[0-9a-fA-F]{6}$'
            description: 'Six-digit hex, for example #22463a'
          - name: body
            label: Body text
            type: string
            required: true
            pattern: '^#[0-9a-fA-F]{6}$'
            description: 'Six-digit hex, for example #22463a'
          - name: muted
            label: Muted background
            type: string
            required: true
            pattern: '^#[0-9a-fA-F]{6}$'
            description: 'Six-digit hex, for example #22463a'
          - name: line
            label: Border
            type: string
            required: true
            pattern: '^#[0-9a-fA-F]{6}$'
            description: 'Six-digit hex, for example #22463a'
          - name: surface
            label: Page background
            type: string
            required: true
            pattern: '^#[0-9a-fA-F]{6}$'
            description: 'Six-digit hex, for example #22463a'
          - name: dark
            label: Dark background
            type: string
            required: true
            pattern: '^#[0-9a-fA-F]{6}$'
            description: 'Six-digit hex, for example #22463a'
          - name: darkFg
            label: Dark text
            type: string
            required: true
            pattern: '^#[0-9a-fA-F]{6}$'
            description: 'Six-digit hex, for example #22463a'
          - { name: radius, label: Corner radius, type: string, required: true }
          - { name: radiusMedia, label: Corner radius (media), type: string, required: true }
          - { name: fontDisplay, label: Display font stack, type: string, required: true }
          - { name: fontHeading, label: Heading font stack, type: string, required: true }
          - { name: fontBody, label: Body font stack, type: string, required: true }
          - { name: fontMono, label: Mono font stack, type: string, required: true }
          - { name: fontHref, label: Web font stylesheet URL, type: string }

  - name: announcement
    label: Announcement Bar
    description: >-
      The thin promotional strip across the top of every page. Turn it off to
      hide it site-wide.
    type: file
    path: src/content/announcement.json
    format: json
    fields:
      - { name: enabled, label: Show the bar, type: boolean, default: false }
      - { name: text, label: Message, type: string }
      - name: link
        label: Link
        type: object
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: URL, type: string }
      - { name: dismissible, label: Visitors can dismiss, type: boolean, default: true }

  - name: popup
    label: Popup
    description: >-
      A promotional dialog shown once per visit. Closes with Escape, and
      never reappears after someone dismisses it.
    type: file
    path: src/content/popup.json
    format: json
    fields:
      - { name: enabled, label: Show the popup, type: boolean, default: false }
      - name: trigger
        label: When to show it
        type: select
        default: delay
        options:
          values:
            - { value: delay, label: After a delay }
            - { value: scroll, label: After scrolling }
            - { value: exit, label: On leaving the page }
      - { name: delaySeconds, label: Delay in seconds, type: number, default: 8 }
      - { name: scrollPercent, label: Scroll percentage, type: number, default: 50 }
      - name: frequency
        label: How often
        type: select
        default: session
        options:
          values:
            - { value: session, label: Once per visit }
            - { value: once, label: Once, then never again }
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: heading, label: Heading, type: string, required: true }
      - { name: body, label: Body, type: rich-text }
      - name: image
        label: Side image
        type: object
        description: >-
          Optional. When set, the popup shows as a two-panel card with this
          image beside the text. Leave empty for a plain text card.
        fields:
          - { name: src, label: File, type: image }
          - { name: alt, label: Alt text, type: string }
      - { name: cta, label: Button, component: link }
      - { name: dismissLabel, label: Dismiss label, type: string, default: No thanks }

  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    format: json
    # Both are required. Without `filename`, Pages CMS falls back to
    # "{year}-{month}-{day}-{primary}.md" and then derives `extension` from it,
    # so the collection lists only *.md and every .json page goes missing.
    filename: '{primary}.json'
    extension: json
    subfolders: true
    view:
      fields: [title, draft]
      # Sort the list by order, not the title column, so the home page
      # (order 0) sits at the top above the rest. Ties fall back to the title.
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      # Live Page URL sits first so an editor sees where the page publishes
      # before anything else.
      - name: permalink
        label: Live Page URL
        type: string
        readonly: true
        description: >-
          Where this page is published -- copy it into your browser to check
          your edit. Read-only: the URL is set by the file name (about.json is
          /about, services/scorpions.json is /services/scorpions, _home.json is the
          site root), so to change it, rename the file.
      # A page can still override its URL with a `slug` in the JSON, honoured by
      # the router and the permalink sync. It is deliberately not a CMS field:
      # pages route by file name, and an editable override only invited the "why
      # is this empty?" confusion. Set it by hand in the rare case it is needed.
      - { name: title, label: Page title, type: string, required: true }
      - name: order
        label: Sort order
        type: number
        default: 100
        description: >-
          Position in this list only. Lower sorts first; the home page is 0 so
          it stays on top. Ties fall back to the title.
      - { name: draft, label: Draft, type: boolean, default: false }

      - name: seo
        label: SEO
        type: object
        fields:
          - { name: title, label: Meta title, type: string }
          - { name: description, label: Meta description, type: text }
          - name: ogImage
            label: Share image
            type: image
            description: Keep it under about 3 MB. 1200x630 works best.
          - { name: noindex, label: Hide from search engines, type: boolean, default: false }

      - { name: sections, label: Page sections, component: page_sections }

  # Global sections -- edited once here, pulled into any page with the "Global
  # section" block. Changing one of these updates every page that shows it.
  # Grouped in the sidebar; the group is navigation-only and does not change
  # where the files are stored.
  - name: globals
    label: Global Sections
    type: group
    items:
      - name: booking
        label: Book a Consultation
        type: file
        path: src/content/booking.json
        format: json
        fields:
          - { name: eyebrow, label: Dimension callout, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: rich-text }
          - name: steps
            label: Steps
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.title}'
            fields:
              - { name: title, label: Title, type: string, required: true }
              - { name: body, label: Body, type: text }
          - { name: cta, label: Button, component: link }

      - name: map
        label: Map
        description: Paste a Google Maps embed URL. Shown wherever the Map global is used.
        type: file
        path: src/content/map.json
        format: json
        fields:
          - { name: eyebrow, label: Dimension callout, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: rich-text }
          - name: embedUrl
            label: Map embed URL
            type: string
            required: true
            description: >-
              From Google Maps: Share -> Embed a map -> copy the src URL (or any
              /maps?...&output=embed link).
          - name: embedTitle
            label: Map title
            type: string
            required: true
            description: Required. Screen readers announce this in place of the map.
          - {
              name: addressLine,
              label: Address line,
              type: string,
              description: Optional plain-text address shown beside the map.,
            }

  # Services is a navigation-only group so the sidebar shows a collapsible
  # "Services" dropdown. Inside it, each pest category is its own collection -- so the
  # category is a dropdown too, listing its main page (_main.json, sorted first by
  # the leading underscore) and its sub-services. Splitting the one services
  # collection into five by folder changes only the CMS sidebar: the Astro side
  # still loads every file from src/content/services via one glob, and routing
