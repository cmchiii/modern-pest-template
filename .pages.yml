      - name: steps
        label: Numbered steps
        type: object
        fields:
          - { name: eyebrow, label: Dimension callout, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: rich-text }
          - name: steps
